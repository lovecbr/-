<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - HowToGuide</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{background:#f8f9fa;}
    .auth-box{max-width:420px;margin:8vh auto;background:#fff;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.08);padding:2rem;}
  </style>
</head>
<body>
  <div class="auth-box">
    <h2 class="mb-4 text-center">登录</h2>
    <div class="mb-3">
      <label class="form-label">邮箱 / 用户名</label>
      <input class="form-control" type="text" placeholder="请输入账号">
    </div>
    <div class="mb-3">
      <label class="form-label">密码</label>
      <input class="form-control" type="password" placeholder="请输入密码">
    </div>
    <button class="btn btn-primary w-100">登录</button>
    <div class="text-center mt-3">
      <a href="/auth/register.html">没有账号？去注册</a>
    </div>
    <div class="text-center mt-2">
      <a href="/">返回首页</a>
    </div>
  </div>
</body>
</html>
