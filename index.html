  <style>
    :root { --primary:#007bff; --text:#333; --bg:#f8f9fa; }
    body { color:var(--text); background:#fff; }
    .header-top { background:#fff; box-shadow:0 2px 4px rgba(0,0,0,.08); position:sticky; top:0; z-index:1000; }

    .cat-card:hover { transform:translateY(-5px); }
    .cat-icon { font-size:2rem; color:var(--primary); }
    .tutorial-card { border:none; box-shadow:0 2px 8px rgba(0,0,0,.08); border-radius:12px; overflow:hidden; height:100%; }
    .tutorial-img { height:180px; object-fit:cover; }
    .footer { background:#f8f9fa; padding:2rem 0; margin-top:3rem; }
    .footer-link { color:#333; text-decoration:none; margin:0 .5rem; }
    .footer-link:hover { color:var(--primary); text-decoration:underline; }
